<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" shape-rendering="crispEdges">
  <!-- Sample cover (placeholder art) for a fictional game: 夜市守門人 -->
  <defs>
    <pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="4" height="4" fill="#ff6a2b"/></pattern>
    <pattern id="stripe" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#ff6a2b"/><rect x="10" width="10" height="10" fill="#fff"/></pattern>
  </defs>
  <rect width="400" height="300" fill="#17161b"/>
  <!-- stars -->
  <g fill="#fff"><rect x="30" y="20" width="4" height="4"/><rect x="120" y="36" width="4" height="4"/><rect x="250" y="16" width="4" height="4"/><rect x="340" y="40" width="4" height="4"/><rect x="190" y="50" width="4" height="4"/></g>
  <!-- lantern string -->
  <g fill="#fff"><rect x="0" y="70" width="400" height="2"/></g>
  <g fill="#ff6a2b">
    <rect x="30" y="72" width="16" height="20"/><rect x="90" y="72" width="16" height="20"/><rect x="150" y="72" width="16" height="20"/><rect x="210" y="72" width="16" height="20"/><rect x="270" y="72" width="16" height="20"/><rect x="330" y="72" width="16" height="20"/>
  </g>
  <g fill="#17161b"><rect x="30" y="80" width="16" height="2"/><rect x="90" y="80" width="16" height="2"/><rect x="150" y="80" width="16" height="2"/><rect x="210" y="80" width="16" height="2"/><rect x="270" y="80" width="16" height="2"/><rect x="330" y="80" width="16" height="2"/></g>
  <!-- stalls -->
  <g>
    <rect x="20" y="120" width="100" height="30" fill="url(#stripe)"/>
    <rect x="30" y="150" width="80" height="60" fill="#fff"/>
    <rect x="40" y="160" width="20" height="14" fill="#17161b"/><rect x="70" y="160" width="30" height="6" fill="#ff6a2b"/><rect x="70" y="170" width="20" height="4" fill="#17161b"/>
    <rect x="150" y="110" width="100" height="30" fill="url(#stripe)"/>
    <rect x="160" y="140" width="80" height="70" fill="#fff"/>
    <rect x="175" y="152" width="50" height="30" fill="#17161b"/><rect x="180" y="158" width="12" height="18" fill="#ff6a2b"/><rect x="196" y="158" width="12" height="18" fill="#ff6a2b"/><rect x="212" y="158" width="8" height="18" fill="#fff"/>
    <rect x="280" y="124" width="100" height="30" fill="url(#stripe)"/>
    <rect x="290" y="154" width="80" height="56" fill="#fff"/>
    <rect x="300" y="164" width="14" height="22" fill="#17161b"/><rect x="320" y="164" width="14" height="22" fill="#17161b"/><rect x="340" y="164" width="14" height="22" fill="#17161b"/>
    <rect x="302" y="168" width="10" height="4" fill="#ff6a2b"/><rect x="322" y="168" width="10" height="4" fill="#ff6a2b"/><rect x="342" y="168" width="10" height="4" fill="#ff6a2b"/>
  </g>
  <!-- ground -->
  <rect x="0" y="210" width="400" height="90" fill="url(#ht)"/>
  <rect x="0" y="210" width="400" height="4" fill="#fff"/>
  <!-- path tiles -->
  <g fill="#17161b"><rect x="0" y="240" width="400" height="30"/></g>
  <g fill="#fff"><rect x="10" y="253" width="20" height="4"/><rect x="60" y="253" width="20" height="4"/><rect x="110" y="253" width="20" height="4"/><rect x="160" y="253" width="20" height="4"/><rect x="210" y="253" width="20" height="4"/><rect x="260" y="253" width="20" height="4"/></g>
  <!-- turret -->
  <g><rect x="64" y="222" width="24" height="20" fill="#fff"/><rect x="70" y="214" width="12" height="8" fill="#fff"/><rect x="82" y="216" width="18" height="4" fill="#fff"/><rect x="70" y="228" width="12" height="6" fill="#ff6a2b"/></g>
  <!-- projectiles -->
  <g fill="#ff6a2b"><rect x="130" y="244" width="8" height="8"/><rect x="190" y="246" width="6" height="6"/><rect x="236" y="247" width="4" height="4"/></g>
  <!-- monsters -->
  <g fill="#fff">
    <rect x="300" y="238" width="24" height="24"/><rect x="296" y="262" width="8" height="6"/><rect x="310" y="262" width="8" height="6"/>
    <rect x="350" y="232" width="28" height="30"/><rect x="346" y="262" width="8" height="6"/><rect x="360" y="262" width="8" height="6"/><rect x="372" y="262" width="8" height="6"/>
  </g>
  <g fill="#17161b"><rect x="304" y="246" width="4" height="4"/><rect x="314" y="246" width="4" height="4"/><rect x="356" y="242" width="5" height="5"/><rect x="368" y="242" width="5" height="5"/><rect x="358" y="252" width="14" height="3"/></g>
  <!-- hud -->
  <g fill="#fff"><rect x="12" y="280" width="60" height="10"/></g><rect x="14" y="282" width="40" height="6" fill="#ff6a2b"/>
  <g fill="#fff"><rect x="330" y="280" width="10" height="10"/><rect x="346" y="280" width="10" height="10"/><rect x="362" y="280" width="10" height="10"/></g>
</svg>
