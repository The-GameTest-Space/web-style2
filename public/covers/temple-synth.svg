<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sample cover (placeholder art) for a fictional game: 廟口電子琴 -->
  <defs>
    <pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#ff6a2b"/></pattern>
  </defs>
  <rect width="400" height="300" fill="#ff6a2b"/>
  <!-- temple roof with swallowtail ridge -->
  <path d="M40 96c30 0 50-20 60-40 20 10 180 10 200 0 10 20 30 40 60 40-20 8-40 8-60 4H100c-20 4-40 4-60-4z" fill="#17161b"/>
  <path d="M96 60c-10-16-26-24-40-22M304 60c10-16 26-24 40-22" fill="none" stroke="#17161b" stroke-width="6" stroke-linecap="round"/>
  <rect x="120" y="100" width="160" height="12" fill="#17161b"/>
  <g fill="#fff"><circle cx="200" cy="54" r="8"/><rect x="150" y="104" width="100" height="4"/></g>
  <!-- pillars -->
  <g fill="#17161b"><rect x="128" y="112" width="12" height="80"/><rect x="260" y="112" width="12" height="80"/></g>
  <!-- rhythm lanes -->
  <rect x="140" y="112" width="120" height="188" fill="#17161b"/>
  <g stroke="#fff" stroke-width="2" opacity=".35"><path d="M180 112v188M220 112v188"/></g>
  <!-- falling notes -->
  <g fill="#ff6a2b"><circle cx="160" cy="138" r="11"/><circle cx="200" cy="176" r="11"/><circle cx="240" cy="150" r="11"/><circle cx="160" cy="214" r="11"/><circle cx="240" cy="232" r="11"/></g>
  <g fill="#fff"><rect x="152" y="120" width="16" height="4" rx="2"/></g>
  <!-- hit line -->
  <rect x="140" y="262" width="120" height="6" fill="#fff"/>
  <g fill="none" stroke="#fff" stroke-width="3"><circle cx="160" cy="265" r="14"/><circle cx="200" cy="265" r="14"/><circle cx="240" cy="265" r="14"/></g>
  <circle cx="200" cy="265" r="22" fill="none" stroke="#ff6a2b" stroke-width="4"/>
  <!-- speaker stacks -->
  <g>
    <rect x="30" y="150" width="80" height="150" fill="#17161b"/>
    <circle cx="70" cy="190" r="24" fill="url(#ht)" stroke="#fff" stroke-width="3"/>
    <circle cx="70" cy="254" r="30" fill="url(#ht)" stroke="#fff" stroke-width="3"/>
    <rect x="290" y="150" width="80" height="150" fill="#17161b"/>
    <circle cx="330" cy="190" r="24" fill="url(#ht)" stroke="#fff" stroke-width="3"/>
    <circle cx="330" cy="254" r="30" fill="url(#ht)" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- sound bursts -->
  <path d="M20 120l14 10M16 140h16M380 120l-14 10M384 140h-16" stroke="#17161b" stroke-width="4" stroke-linecap="round"/>
</svg>
