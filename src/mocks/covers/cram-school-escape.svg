<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sample cover (placeholder art) for a fictional game: 補習班大逃脫 -->
  <defs>
    <pattern id="floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fff"/><path d="M0 0h40v40" fill="none" stroke="#17161b" stroke-width="1" opacity=".25"/></pattern>
  </defs>
  <rect width="400" height="300" fill="url(#floor)"/>
  <!-- whiteboard -->
  <rect x="20" y="16" width="250" height="60" fill="#fff" stroke="#17161b" stroke-width="5"/>
  <g stroke="#17161b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M36 36h30M42 30v12M78 36h10M96 30l10 12M106 30L96 42M120 36h16M124 32h8M124 40h8M148 30c10 0 10 12 0 12"/>
    <path d="M36 58h80M130 58h50"/>
  </g>
  <text x="196" y="44" font-family="sans-serif" font-weight="900" font-size="18" fill="#ff6a2b">模擬考</text>
  <!-- clock -->
  <circle cx="310" cy="46" r="26" fill="#fff" stroke="#17161b" stroke-width="5"/>
  <path d="M310 46V30M310 46l12 4" stroke="#17161b" stroke-width="4" stroke-linecap="round"/>
  <!-- desks, top-down -->
  <g fill="#17161b">
    <rect x="40" y="110" width="56" height="30"/><rect x="120" y="110" width="56" height="30"/><rect x="200" y="110" width="56" height="30"/>
    <rect x="40" y="170" width="56" height="30"/><rect x="120" y="170" width="56" height="30"/><rect x="200" y="170" width="56" height="30"/>
    <rect x="40" y="230" width="56" height="30"/><rect x="120" y="230" width="56" height="30"/><rect x="200" y="230" width="56" height="30"/>
  </g>
  <g fill="#fff"><rect x="48" y="116" width="20" height="14"/><rect x="128" y="176" width="20" height="14"/><rect x="208" y="236" width="20" height="14"/><rect x="208" y="116" width="20" height="14"/></g>
  <!-- teacher's flashlight cone -->
  <path d="M300 140L180 90v110z" fill="#ff6a2b" opacity=".28"/>
  <circle cx="306" cy="140" r="16" fill="#17161b"/>
  <rect x="290" y="156" width="32" height="40" rx="6" fill="#17161b"/>
  <!-- sneaking players -->
  <g>
    <circle cx="110" cy="158" r="9" fill="#ff6a2b"/><circle cx="188" cy="220" r="9" fill="#fff" stroke="#17161b" stroke-width="3"/>
    <circle cx="268" cy="262" r="9" fill="#ff6a2b"/><circle cx="30" cy="212" r="9" fill="#fff" stroke="#17161b" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#17161b" stroke-width="2" stroke-dasharray="4 5"><path d="M110 158c30 10 50 40 78 62M188 220c30 10 60 30 80 42"/></g>
  <!-- exit door -->
  <rect x="330" y="220" width="56" height="70" fill="#17161b"/>
  <rect x="336" y="206" width="44" height="14" fill="#ff6a2b"/>
  <path d="M346 212h6M356 210l4 4-4 4M364 213h8" stroke="#17161b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="376" cy="256" r="3" fill="#fff"/>
</svg>
