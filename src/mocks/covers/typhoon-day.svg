<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sample cover (placeholder art) for a fictional game: 颱風假 -->
  <defs>
    <pattern id="rain" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><rect x="6" width="2" height="9" fill="#17161b" opacity=".55"/></pattern>
    <pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#17161b"/></pattern>
  </defs>
  <rect width="400" height="300" fill="#fff"/>
  <!-- wall -->
  <rect width="400" height="300" fill="url(#ht)" opacity=".35"/>
  <!-- window -->
  <rect x="70" y="30" width="260" height="190" fill="#fff" stroke="#17161b" stroke-width="10"/>
  <g>
    <rect x="75" y="35" width="250" height="180" fill="#fff"/>
    <!-- buildings -->
    <path d="M75 215V120h40v-20h30v60h26V96h44v30h30v-16h36v34h44v71z" fill="#17161b" opacity=".85"/>
    <g fill="#fff"><rect x="86" y="134" width="8" height="10"/><rect x="100" y="134" width="8" height="10"/><rect x="186" y="110" width="8" height="10"/><rect x="200" y="110" width="8" height="10"/><rect x="186" y="130" width="8" height="10"/><rect x="290" y="150" width="8" height="10"/><rect x="304" y="150" width="8" height="10"/></g>
    <rect x="75" y="35" width="250" height="180" fill="url(#rain)"/>
  </g>
  <line x1="200" y1="35" x2="200" y2="215" stroke="#17161b" stroke-width="8"/>
  <!-- tape X on glass -->
  <g stroke="#ff6a2b" stroke-width="9" stroke-linecap="butt" opacity=".95">
    <path d="M82 44l110 164M192 44L82 208"/>
    <path d="M208 44l110 164M318 44L208 208"/>
  </g>
  <!-- sill -->
  <rect x="50" y="220" width="300" height="16" fill="#17161b"/>
  <!-- noodle cup -->
  <path d="M236 176h44l-6 44h-32z" fill="#ff6a2b"/>
  <rect x="232" y="170" width="52" height="8" fill="#17161b"/>
  <path d="M250 170c-4-18 8-22 4-36M262 170c-4-14 8-20 4-30" fill="none" stroke="#17161b" stroke-width="3" stroke-linecap="round"/>
  <!-- candle -->
  <rect x="120" y="188" width="14" height="32" fill="#fff" stroke="#17161b" stroke-width="3"/>
  <path d="M127 186c-7-8 0-16 0-20 5 6 8 12 0 20z" fill="#ff6a2b"/>
  <!-- floor shadow -->
  <rect x="0" y="236" width="400" height="64" fill="#17161b"/>
  <circle cx="127" cy="262" r="30" fill="#ff6a2b" opacity=".22"/>
</svg>
